[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "werewolf-agent-skills"
version = "0.1.0"
description = "Deterministic werewolf orchestration core and OpenClaw skills"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "OpenClaw" }]
license = { text = "MIT" }
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.8",
]

[project.scripts]
werewolf-run-game = "werewolf_core.runner:main"
werewolf-run-batch = "werewolf_core.batch:main"

[tool.setuptools.packages.find]
where = ["packages"]
include = ["werewolf_core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["packages", "."]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tools/*.py" = ["E402"]
"skills/*/*.py" = ["E402"]
